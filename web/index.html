<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Security Scanner</title>
<style>
:root {
  --bg:       #0f172a;
  --surface:  #1e293b;
  --surface2: #263248;
  --border:   #334155;
  --text:     #f1f5f9;
  --muted:    #94a3b8;
  --accent:   #3b82f6;
  --accent-h: #2563eb;
  --crit:     #dc2626;
  --high:     #d97706;
  --med:      #2563eb;
  --low:      #16a34a;
  --info:     #6b7280;
  --ok:       #22c55e;
  --warn:     #f59e0b;
  --err:      #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

/* ── Header ─────────────────────────────────────────── */
header {
  border-bottom: 1px solid var(--border);
  padding: .875rem 2rem;
  display: flex;
  align-items: center;
  gap: .75rem;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.logo { font-size: 1.4rem; }
header h1 { font-size: 1rem; font-weight: 700; }
.header-sub { font-size: .78rem; color: var(--muted); }
.phase-pill {
  margin-left: auto;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: .25rem .75rem;
  border-radius: 99px;
  border: 1px solid var(--border);
  color: var(--muted);
  display: none;
}
.phase-pill.visible { display: inline-block; }

/* ── Layout ──────────────────────────────────────────── */
main { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
.phase { display: none; }
.phase.active { display: block; }

/* ── Input phase ─────────────────────────────────────── */
.input-hero {
  text-align: center;
  margin-bottom: 2rem;
}
.input-hero .hero-icon { font-size: 3.5rem; margin-bottom: .75rem; }
.input-hero h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: .4rem; }
.input-hero p { color: var(--muted); font-size: .9rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: .75rem;
  padding: 2rem;
}

.form-group { margin-bottom: 1.25rem; }
.form-group label {
  display: block;
  font-size: .72rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: .4rem;
}
.label-note { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
.input-wrap { position: relative; }
.form-group input,
.form-group select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: .5rem;
  padding: .75rem 1rem;
  color: var(--text);
  font-size: .9rem;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  appearance: none;
}
.form-group input:focus,
.form-group select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
.form-group input::placeholder { color: var(--muted); }
.eye-btn {
  position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 1rem; padding: .2rem; line-height: 1;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

.scan-btn {
  width: 100%;
  padding: .875rem;
  border: none;
  border-radius: .5rem;
  background: var(--accent);
  color: #fff;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s, transform .1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  margin-top: .75rem;
}
.scan-btn:hover:not(:disabled) { background: var(--accent-h); }
.scan-btn:active:not(:disabled) { transform: scale(.99); }
.scan-btn:disabled { opacity: .55; cursor: not-allowed; }
.spin { display: inline-block; animation: rotate .7s linear infinite; }
@keyframes rotate { to { transform: rotate(360deg); } }

/* ── PR info card ───────────────────────────────────── */
.pr-banner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: .75rem;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
  display: flex;
  gap: 1rem;
  align-items: flex-start;
}
.pr-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: var(--border); }
.pr-info h3 { font-size: 1rem; font-weight: 700; margin-bottom: .3rem; }
.pr-meta { display: flex; flex-wrap: wrap; gap: .25rem .75rem; font-size: .78rem; color: var(--muted); }
.pr-link { color: var(--accent); text-decoration: none; }
.pr-link:hover { text-decoration: underline; }

/* ── Progress ───────────────────────────────────────── */
.progress-section { margin-bottom: 1.5rem; }
.progress-header {
  display: flex; justify-content: space-between;
  font-size: .82rem; color: var(--muted); margin-bottom: .5rem;
}
.progress-track {
  background: var(--border); border-radius: 99px; height: 5px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), #60a5fa);
  width: 0%; transition: width .35s ease;
}

/* ── File list ───────────────────────────────────────── */
.file-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: .75rem;
  overflow: hidden;
}
.file-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .7rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
  transition: background .12s;
}
.file-item:last-child { border-bottom: none; }
.file-item.is-scanning { background: rgba(59,130,246,.06); }
.file-icon { font-size: .95rem; flex-shrink: 0; width: 1.25rem; text-align: center; }
.file-name { flex: 1; font-family: monospace; font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lang-tag {
  font-size: .68rem; color: var(--muted);
  background: var(--bg); padding: .1rem .45rem; border-radius: .2rem;
  flex-shrink: 0;
}
.file-status { margin-left: auto; font-size: .78rem; display: flex; align-items: center; gap: .3rem; flex-shrink: 0; }
.s-waiting  { color: var(--muted); }
.s-scanning { color: var(--accent); }
.s-clean    { color: var(--ok); }
.s-skip     { color: var(--muted); font-style: italic; }

/* ── Log ─────────────────────────────────────────────── */
.log-box {
  margin-top: 1rem;
  background: rgba(0,0,0,.3);
  border: 1px solid var(--border);
  border-radius: .5rem;
  padding: .6rem .9rem;
  font-family: monospace;
  font-size: .76rem;
  color: var(--muted);
  max-height: 5.5rem;
  overflow-y: auto;
}
.log-line { margin-bottom: .1rem; }
.log-line.warning { color: var(--warn); }
.log-line.error   { color: var(--err); }

/* ── Results phase ───────────────────────────────────── */
.results-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: .75rem;
}
.results-header h2 { font-size: 1.25rem; font-weight: 800; }

.btn-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.dl-btn {
  padding: .45rem .9rem;
  border: 1px solid var(--border);
  border-radius: .4rem;
  background: var(--surface);
  color: var(--text);
  font-size: .8rem;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  transition: border-color .12s, background .12s;
}
.dl-btn:hover { border-color: var(--accent); background: var(--surface2); }
.dl-btn.prim { background: var(--accent); border-color: var(--accent); color: #fff; }
.dl-btn.prim:hover { background: var(--accent-h); border-color: var(--accent-h); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: .875rem;
  margin-bottom: 1.5rem;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: .6rem;
  padding: 1rem;
  text-align: center;
}
.stat-num { font-size: 2.2rem; font-weight: 800; line-height: 1; }
.stat-label { font-size: .7rem; color: var(--muted); margin-top: .2rem; text-transform: uppercase; letter-spacing: .06em; }

/* ── Result file cards ───────────────────────────────── */
.result-cards { display: flex; flex-direction: column; gap: .875rem; }
.rc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: .75rem;
  overflow: hidden;
  transition: border-color .15s;
}
.rc-head {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .875rem 1.25rem;
  cursor: pointer;
  user-select: none;
  transition: background .1s;
}
.rc-head:hover { background: var(--surface2); }
.rc-file { font-family: monospace; font-size: .85rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-lang { font-size: .72rem; color: var(--muted); flex-shrink: 0; }
.rc-badge {
  font-size: .7rem; font-weight: 700; padding: .2rem .55rem;
  border-radius: .25rem; color: #fff; flex-shrink: 0;
}
.rc-clean { font-size: .8rem; color: var(--ok); flex-shrink: 0; }
.rc-chevron { color: var(--muted); font-size: .72rem; flex-shrink: 0; transition: transform .2s; }
.rc-head.open .rc-chevron { transform: rotate(180deg); }

.rc-body { display: none; border-top: 1px solid var(--border); }
.rc-body.open { display: block; }
.rc-clean-msg { padding: .9rem 1.25rem; color: var(--ok); font-size: .85rem; }

.vuln-item {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 1rem;
  padding: .875rem 1.25rem;
  border-bottom: 1px solid var(--border);
}
.vuln-item:last-child { border-bottom: none; }
.vi-left { text-align: center; }
.sev-badge {
  display: inline-block;
  font-size: .68rem; font-weight: 700;
  padding: .2rem .5rem; border-radius: .25rem; color: #fff;
}
.vi-line { font-size: .7rem; color: var(--muted); margin-top: .2rem; }
.vi-src  { font-size: .65rem; color: var(--muted); margin-top: .15rem; }
.vi-right h4 { font-size: .875rem; font-weight: 700; margin-bottom: .25rem; }
.vi-desc   { font-size: .8rem; color: var(--muted); margin-bottom: .3rem; }
.vi-impact { font-size: .8rem; color: var(--warn); margin-bottom: .25rem; }
.vi-owasp  { font-size: .7rem; color: var(--muted); margin-bottom: .5rem; }
.fix-toggle { font-size: .78rem; color: var(--accent); cursor: pointer; }
.fix-code {
  margin-top: .4rem;
  background: rgba(0,0,0,.35);
  border-radius: .4rem;
  padding: .65rem .9rem;
  font-family: monospace;
  font-size: .76rem;
  color: #86efac;
  white-space: pre-wrap;
  overflow-x: auto;
}

/* ── Error card ──────────────────────────────────────── */
.error-card {
  background: rgba(239,68,68,.08);
  border: 1px solid rgba(239,68,68,.25);
  border-radius: .75rem;
  padding: 2rem;
  text-align: center;
  margin-top: 1.5rem;
}
.error-card .ei { font-size: 2.5rem; margin-bottom: .5rem; }
.error-card h3 { color: var(--err); font-size: 1.1rem; margin-bottom: .4rem; }
.error-card p { color: var(--muted); font-size: .875rem; margin-bottom: .75rem; }
.error-detail {
  text-align: left; font-family: monospace; font-size: .72rem;
  color: var(--muted); background: var(--bg); border-radius: .4rem;
  padding: .75rem; max-height: 150px; overflow: auto; margin-bottom: 1rem;
  display: none;
}
</style>
</head>
<body>

<header>
  <span class="logo">🔒</span>
  <div>
    <h1>Security Scanner</h1>
    <div class="header-sub">AI + Static Analysis</div>
  </div>
  <span class="phase-pill" id="phase-pill"></span>
</header>

<main>

  <!-- ═══════════════ INPUT ═══════════════ -->
  <section class="phase active" id="phase-input">
    <div class="input-hero">
      <div class="hero-icon">🔍</div>
      <h2>Analyze a Pull Request</h2>
      <p>Paste a GitHub PR link — we'll fetch the changed files and scan them for security vulnerabilities using Gemini AI + AST static analysis.</p>
    </div>

    <div class="card">
      <form id="scan-form" autocomplete="off">

        <div class="form-group">
          <label>GitHub PR URL</label>
          <input type="url" id="pr-url"
            placeholder="https://github.com/owner/repo/pull/123"
            required/>
        </div>

        <div class="form-group">
          <label>GitHub Token <span class="label-note">(required for private repos, optional for public)</span></label>
          <div class="input-wrap">
            <input type="password" id="gh-token"
              placeholder="ghp_••••••••••••••••••••"/>
            <button type="button" class="eye-btn" onclick="toggleToken()">👁</button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Gemini Model</label>
            <select id="sel-model">
              <option value="gemini-2.5-flash">gemini-2.5-flash  (fast)</option>
              <option value="gemini-2.5-pro">gemini-2.5-pro  (thorough)</option>
              <option value="gemini-2.0-flash">gemini-2.0-flash</option>
            </select>
          </div>
          <div class="form-group">
            <label>Minimum Severity</label>
            <select id="sel-sev">
              <option value="LOW">LOW — show all</option>
              <option value="MEDIUM">MEDIUM and above</option>
              <option value="HIGH">HIGH and above</option>
              <option value="CRITICAL">CRITICAL only</option>
            </select>
          </div>
        </div>

        <button type="submit" class="scan-btn" id="scan-btn">
          <span id="btn-icon">🔍</span>
          <span id="btn-text">Scan PR</span>
        </button>
      </form>
    </div>
  </section>

  <!-- ═══════════════ SCANNING ═══════════════ -->
  <section class="phase" id="phase-scanning">

    <div class="pr-banner" id="pr-banner">
      <img class="pr-avatar" id="pr-avatar" src="" alt=""/>
      <div class="pr-info">
        <h3 id="pr-title">Fetching PR…</h3>
        <div class="pr-meta" id="pr-meta"></div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <span id="prog-label">Preparing…</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="prog-fill"></div>
      </div>
    </div>

    <div class="file-list" id="file-list">
      <div class="file-item" style="color:var(--muted);font-size:.85rem">
        <span class="spin">⟳</span> Connecting to GitHub…
      </div>
    </div>

    <div class="log-box" id="log-box"></div>
  </section>

  <!-- ═══════════════ RESULTS ═══════════════ -->
  <section class="phase" id="phase-results">
    <div class="results-header">
      <h2 id="results-title">Scan Results</h2>
      <div class="btn-row" id="dl-row"></div>
    </div>

    <div class="stat-grid" id="stat-grid"></div>
    <div class="result-cards" id="result-cards"></div>

    <div style="text-align:center;margin-top:2.5rem">
      <button class="dl-btn prim" onclick="goInput()">🔄 Scan Another PR</button>
    </div>
  </section>

  <!-- ═══════════════ ERROR ═══════════════ -->
  <div id="error-box" style="display:none">
    <div class="error-card">
      <div class="ei">⚠️</div>
      <h3 id="err-title">Something went wrong</h3>
      <p id="err-msg"></p>
      <pre class="error-detail" id="err-detail"></pre>
      <button class="dl-btn prim" onclick="goInput()">← Try Again</button>
    </div>
  </div>

</main>

<script>
// ──────────────────────────────────────────────────────
//  State
// ──────────────────────────────────────────────────────
const S = {
  scanId:    null,
  files:     {},      // path → {language, status, findings, severity, vulns}
  fileOrder: [],
  prInfo:    null,
  summary:   null,
};

const SEV = ['CRITICAL','HIGH','MEDIUM','LOW','INFO'];
const SEVC = {
  CRITICAL: '#dc2626', HIGH: '#d97706',
  MEDIUM: '#2563eb', LOW: '#16a34a', INFO: '#6b7280',
};
const LANG_ICON = {
  Python:'🐍', JavaScript:'📜', TypeScript:'📘',
  Go:'🐹', Java:'☕', Ruby:'💎', PHP:'🐘',
  Rust:'⚙️', 'C++':'🔩', C:'🔩',
};

// ──────────────────────────────────────────────────────
//  Phase management
// ──────────────────────────────────────────────────────
function setPhase(p) {
  document.querySelectorAll('.phase').forEach(el => el.classList.remove('active'));
  document.getElementById('phase-' + p).classList.add('active');
  document.getElementById('error-box').style.display = 'none';

  const pill = document.getElementById('phase-pill');
  const labels = {input:'', scanning:'Scanning…', results:'Done'};
  pill.textContent = labels[p] || '';
  pill.classList.toggle('visible', p !== 'input');
}

function goInput() {
  Object.assign(S, {scanId:null, files:{}, fileOrder:[], prInfo:null, summary:null});
  document.getElementById('scan-btn').disabled = false;
  document.getElementById('btn-icon').textContent = '🔍';
  document.getElementById('btn-text').textContent = 'Scan PR';
  document.getElementById('log-box').innerHTML = '';
  setPhase('input');
}

// ──────────────────────────────────────────────────────
//  Helpers
// ──────────────────────────────────────────────────────
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function badge(sev) {
  const c = SEVC[sev]||'#6b7280';
  return `<span class="sev-badge" style="background:${c}">${esc(sev)}</span>`;
}

function addLog(text, level='info') {
  const box = document.getElementById('log-box');
  const d = document.createElement('div');
  d.className = 'log-line ' + level;
  d.textContent = '› ' + text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function showError(title, msg, detail='') {
  document.getElementById('error-box').style.display = 'block';
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-msg').textContent = msg;
  const det = document.getElementById('err-detail');
  if (detail) { det.textContent = detail; det.style.display = 'block'; }
  else { det.style.display = 'none'; }
}

function setProgress(done, total) {
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-label').textContent =
    total ? `${done} / ${total} files` : 'Preparing…';
}

function toggleToken() {
  const el = document.getElementById('gh-token');
  el.type = el.type === 'password' ? 'text' : 'password';
}

// ──────────────────────────────────────────────────────
//  Form submit
// ──────────────────────────────────────────────────────
document.getElementById('scan-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('scan-btn');
  btn.disabled = true;
  document.getElementById('btn-icon').textContent = '⟳';
  document.getElementById('btn-text').textContent = 'Starting…';
  document.getElementById('file-list').innerHTML =
    '<div class="file-item" style="color:var(--muted)"><span class="spin">⟳</span>&nbsp;Connecting to GitHub…</div>';
  setProgress(0, 0);

  const body = {
    pr_url:       document.getElementById('pr-url').value.trim(),
    github_token: document.getElementById('gh-token').value.trim(),
    model:        document.getElementById('sel-model').value,
    min_severity: document.getElementById('sel-sev').value,
    use_static:   true,
  };

  try {
    const r = await fetch('/api/scan', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json();
      throw new Error(err.detail || 'Server error ' + r.status);
    }
    const {scan_id} = await r.json();
    S.scanId = scan_id;
    S.files = {}; S.fileOrder = [];
    document.getElementById('log-box').innerHTML = '';
    document.getElementById('pr-title').textContent = 'Fetching PR…';
    document.getElementById('pr-meta').innerHTML = '';
    document.getElementById('pr-avatar').src = '';
    setPhase('scanning');
    openSSE(scan_id);
  } catch (err) {
    showError('Could not start scan', err.message);
    btn.disabled = false;
    document.getElementById('btn-icon').textContent = '🔍';
    document.getElementById('btn-text').textContent = 'Scan PR';
  }
});

// ──────────────────────────────────────────────────────
//  Server-Sent Events
// ──────────────────────────────────────────────────────
function openSSE(scanId) {
  const es = new EventSource(`/api/scan/${scanId}/events`);
  es.onmessage = ev => {
    const data = JSON.parse(ev.data);
    if (data.type === 'done') { es.close(); return; }
    handleEvent(data, scanId);
  };
  es.onerror = () => {
    es.close();
    if (document.getElementById('phase-scanning').classList.contains('active')) {
      showError('Connection lost', 'The scan stream was interrupted. Try again.');
    }
  };
}

function handleEvent(data, scanId) {
  switch (data.type) {

    case 'log':
      addLog(data.text, data.level || 'info');
      break;

    case 'pr_info':
      S.prInfo = data;
      document.getElementById('pr-avatar').src = data.avatar || '';
      document.getElementById('pr-title').innerHTML =
        `<a class="pr-link" href="${esc(data.pr_url)}" target="_blank">${esc(data.title)}</a>`;
      document.getElementById('pr-meta').innerHTML = [
        `📦 <strong>${esc(data.repo)}</strong>`,
        `#${data.pr_num}`,
        `🌿 ${esc(data.branch)}`,
        `👤 ${esc(data.author)}`,
        `📄 ${data.scannable_files} scannable / ${data.total_files} changed`,
        `🔖 ${esc(data.sha)}`,
      ].map(s=>`<span>${s}</span>`).join('');
      addLog(`PR #${data.pr_num}: ${data.title}`);
      addLog(`${data.scannable_files} scannable file(s) of ${data.total_files} changed`);
      break;

    case 'file_start':
      S.files[data.file] = {language:data.language, status:'scanning', findings:0, severity:null, vulns:[]};
      if (!S.fileOrder.includes(data.file)) S.fileOrder.push(data.file);
      renderFileList();
      setProgress(data.index, data.total);
      break;

    case 'file_done':
      Object.assign(S.files[data.file] || {}, {
        status: data.findings > 0 ? 'done' : 'clean',
        findings: data.findings,
        severity: data.severity,
        vulns: data.vulns || [],
      });
      if (S.files[data.file]) {
        S.files[data.file].status  = data.findings > 0 ? 'done' : 'clean';
        S.files[data.file].findings = data.findings;
        S.files[data.file].severity = data.severity;
        S.files[data.file].vulns    = data.vulns || [];
      }
      renderFileList();
      break;

    case 'file_skip':
      if (S.files[data.file]) S.files[data.file].status = 'skip';
      renderFileList();
      break;

    case 'complete':
      S.summary = data;
      setProgress(data.total_files, data.total_files);
      document.getElementById('prog-label').textContent = '✅ Scan complete';
      setTimeout(() => renderResults(scanId), 500);
      break;

    case 'error':
      addLog(data.text, 'error');
      showError('Scan failed', data.text, data.detail || '');
      break;
  }
}

// ──────────────────────────────────────────────────────
//  File list render
// ──────────────────────────────────────────────────────
function renderFileList() {
  const el = document.getElementById('file-list');
  if (!S.fileOrder.length) return;

  el.innerHTML = S.fileOrder.map(path => {
    const f = S.files[path];
    const icon = LANG_ICON[f.language] || '📄';
    const short = path.length > 52 ? '…' + path.slice(-49) : path;

    let statusHtml = '';
    let extraClass = '';
    switch(f.status) {
      case 'scanning':
        statusHtml = `<span class="file-status s-scanning"><span class="spin">⟳</span> Scanning…</span>`;
        extraClass = 'is-scanning';
        break;
      case 'clean':
        statusHtml = `<span class="file-status s-clean">✅ Clean</span>`;
        break;
      case 'done': {
        const c = SEVC[f.severity] || '#d97706';
        statusHtml = `<span class="file-status" style="color:${c}">${badge(f.severity)} ${f.findings} finding${f.findings!==1?'s':''}</span>`;
        break;
      }
      case 'skip':
        statusHtml = `<span class="file-status s-skip">— skipped</span>`;
        break;
      default:
        statusHtml = `<span class="file-status s-waiting">⏳</span>`;
    }

    return `<div class="file-item ${extraClass}">
      <span class="file-icon">${icon}</span>
      <span class="file-name" title="${esc(path)}">${esc(short)}</span>
      <span class="lang-tag">${esc(f.language)}</span>
      ${statusHtml}
    </div>`;
  }).join('');
}

// ──────────────────────────────────────────────────────
//  Results render
// ──────────────────────────────────────────────────────
function renderResults(scanId) {
  setPhase('results');

  // PR title in header
  const prTitle = S.prInfo ? ` — ${S.prInfo.repo} #${S.prInfo.pr_num}` : '';
  document.getElementById('results-title').textContent = `Scan Results${prTitle}`;

  // Download buttons
  document.getElementById('dl-row').innerHTML = [
    ['📄 HTML',  `html`],
    ['{ } JSON', `json`],
    ['🔬 SARIF', `sarif`],
  ].map(([label, fmt]) =>
    `<a class="dl-btn" href="/api/scan/${scanId}/download/${fmt}" download>${label}</a>`
  ).join('') +
  `<button class="dl-btn prim" onclick="goInput()">🔄 New Scan</button>`;

  // Stat cards
  const counts = S.summary?.severity_counts || {};
  const total  = S.summary?.total_findings  || 0;
  const sevCards = SEV.slice(0,4).map(s => {
    const c = SEVC[s];
    return `<div class="stat-card">
      <div class="stat-num" style="color:${c}">${counts[s]||0}</div>
      <div class="stat-label">${s}</div>
    </div>`;
  }).join('');
  document.getElementById('stat-grid').innerHTML = sevCards +
    `<div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>` +
    `<div class="stat-card"><div class="stat-num">${S.fileOrder.length}</div><div class="stat-label">Files</div></div>`;

  // File result cards — worst-severity first
  const entries = Object.entries(S.files).filter(([,f]) => f.status !== 'skip');
  entries.sort(([,a],[,b]) => {
    const sa = SEV.indexOf(a.severity ?? 'INFO');
    const sb = SEV.indexOf(b.severity ?? 'INFO');
    return sa - sb;
  });

  document.getElementById('result-cards').innerHTML = entries.map(([path, f]) => {
    const borderColor = f.severity ? (SEVC[f.severity]||'var(--border)') : 'var(--border)';
    const short = path.length > 58 ? '…' + path.slice(-55) : path;
    const headerRight = f.findings > 0
      ? `<span class="rc-badge" style="background:${SEVC[f.severity]||'#d97706'}">${f.findings} finding${f.findings!==1?'s':''}</span>`
      : `<span class="rc-clean">✅ clean</span>`;

    const body = f.findings === 0
      ? `<div class="rc-clean-msg">✅ No vulnerabilities detected in this file.</div>`
      : (f.vulns||[]).map(v => `
        <div class="vuln-item">
          <div class="vi-left">
            ${badge(v.severity)}
            ${v.line_number ? `<div class="vi-line">line ${v.line_number}</div>` : ''}
            <div class="vi-src">${v.source==='static'?'🔬 static':'🤖 llm'}</div>
          </div>
          <div class="vi-right">
            <h4>${esc(v.type)}</h4>
            <div class="vi-desc">${esc(v.description)}</div>
            <div class="vi-impact">⚠️ ${esc(v.impact)}</div>
            ${v.owasp ? `<div class="vi-owasp">📋 ${esc(v.owasp)}</div>` : ''}
            <details><summary class="fix-toggle">Show fix</summary>
              <pre class="fix-code">${esc(v.fix)}</pre>
            </details>
          </div>
        </div>`).join('');

    return `<div class="rc" style="border-color:${borderColor}">
      <div class="rc-head" onclick="toggleRC(this)">
        <span class="rc-file" title="${esc(path)}">${esc(short)}</span>
        <span class="rc-lang">${esc(f.language)}</span>
        ${headerRight}
        <span class="rc-chevron">▼</span>
      </div>
      <div class="rc-body">${body}</div>
    </div>`;
  }).join('');

  // Auto-expand files that have findings
  document.querySelectorAll('.rc-head').forEach(h => {
    if (h.querySelector('.rc-badge')) {
      h.classList.add('open');
      h.nextElementSibling.classList.add('open');
    }
  });
}

function toggleRC(head) {
  head.classList.toggle('open');
  head.nextElementSibling.classList.toggle('open');
}
</script>
</body>
